name: 云编译 APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'android_app/**'
      - 'ai_core/**'
      - 'automation/**'
      - 'personality/**'
      - '.github/workflows/build-android-release.yml'
  pull_request:
    paths:
      - 'android_app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'release'
        options: [debug, release]

jobs:
  python-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 自测试
        run: python3 demo/self_test.py

  build-debug:
    needs: python-test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 设置构建版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}-debug" >> $GITHUB_OUTPUT
      - name: 编译 Debug APK
        working-directory: android_app
        run: |
          # CI 是 x86_64，移除 Termux 专用的 aapt2 覆盖
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleDebug --no-daemon
      - name: 重命名 APK
        run: cp android_app/app/build/outputs/apk/debug/app-debug.apk ${{ steps.version.outputs.apk_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.version.outputs.apk_name }}.apk
          retention-days: 30

  build-release:
    needs: python-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 设置构建版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}-release" >> $GITHUB_OUTPUT
      - name: 编译 Release APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleRelease --no-daemon
      - name: 签名 Release APK
        continue-on-error: true
        run: |
          UNSIGNED=android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=${{ steps.version.outputs.apk_name }}.apk
          KEYSTORE_FILE=linghui.jks

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $KEYSTORE_FILE 2>/dev/null || true

          if [ -s $KEYSTORE_FILE ]; then
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks $KEYSTORE_FILE \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out $SIGNED \
              $UNSIGNED
            rm -f $KEYSTORE_FILE
            echo "已签名: $SIGNED"
          else
            cp $UNSIGNED ${{ steps.version.outputs.apk_name }}-unsigned.apk
            echo "未签名（无密钥）"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: |
            ${{ steps.version.outputs.apk_name }}.apk
            ${{ steps.version.outputs.apk_name }}-unsigned.apk
          retention-days: 90
