name: 云编译 APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'android_app/**'
      - 'ai_core/**'
      - 'automation/**'
      - 'personality/**'
      - '.github/workflows/build-android-release.yml'
  pull_request:
    paths:
      - 'android_app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'debug'
        options: [debug, release]

jobs:
  # ── Python AI 管线测试 ──
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 自测试
        run: python3 demo/self_test.py

  # ── Debug APK ──
  build-debug:
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 设置构建版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}-debug" >> $GITHUB_OUTPUT

      - name: 编译 Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon

      - name: 重命名 APK
        run: |
          cp android_app/app/build/outputs/apk/debug/app-debug.apk \
             ${{ steps.version.outputs.apk_name }}.apk

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.version.outputs.apk_name }}.apk
          retention-days: 30

  # ── Release APK ──
  build-release:
    needs: python-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 设置构建版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}-release" >> $GITHUB_OUTPUT

      - name: 编译 Release APK
        working-directory: android_app
        run: gradle assembleRelease --no-daemon

      - name: 签名 APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android_app/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: 重命名已签名 APK
        if: steps.sign_app.outputs.signedReleaseFile != ''
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" \
             ${{ steps.version.outputs.apk_name }}.apk

      - name: 重命名未签名 APK（签名失败回退）
        if: steps.sign_app.outputs.signedReleaseFile == ''
        run: |
          cp android_app/app/build/outputs/apk/release/app-release-unsigned.apk \
             ${{ steps.version.outputs.apk_name }}-unsigned.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: |
            ${{ steps.version.outputs.apk_name }}.apk
            ${{ steps.version.outputs.apk_name }}-unsigned.apk
          retention-days: 90
