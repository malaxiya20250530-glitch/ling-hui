name: 云编译 APK · 小球版

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'release'
        options: [debug, release]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: 验证 WebView assets
        run: |
          echo "=== assets ==="
          ls -la android_app/app/src/main/assets/linghui/
          wc -c android_app/app/src/main/assets/linghui/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: 编译 Debug APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleDebug --no-daemon

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-release:
    needs: build-debug
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: 编译 Release APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleRelease --no-daemon

      - name: 签名 Release APK
        run: |
          UNSIGNED=android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=${{ steps.version.outputs.apk_name }}-release.apk
          BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0

          $BUILD_TOOLS/apksigner sign \
            --ks linghui.jks \
            --ks-key-alias linghui \
            --ks-pass pass:linghui2025 \
            --key-pass pass:linghui2025 \
            --out $SIGNED \
            $UNSIGNED

          echo "✅ 已签名: $SIGNED"

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-release
          path: ${{ steps.version.outputs.apk_name }}-release.apk
          retention-days: 90
