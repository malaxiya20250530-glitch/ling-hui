name: 云编译 APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'android_app/**'
      - 'unity_client/**'
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'release'
        options: [debug, release]

jobs:
  # ═══ 检测构建模式 ═══
  detect-mode:
    runs-on: ubuntu-latest
    outputs:
      unity_mode: ${{ steps.detect.outputs.unity_mode }}
      mode_suffix: ${{ steps.detect.outputs.mode_suffix }}
      mode_label: ${{ steps.detect.outputs.mode_label }}
    steps:
      - uses: actions/checkout@v4

      - name: 检测 Unity 模块
        id: detect
        run: |
          if [ -f "unity_client/unityLibrary/build.gradle" ]; then
            echo "unity_mode=true" >> $GITHUB_OUTPUT
            echo "mode_suffix=-unity" >> $GITHUB_OUTPUT
            echo "mode_label=Unity 3D 角色版"
            echo "🎮 检测到 Unity 模块 → 编译 3D 角色版"
          else
            echo "unity_mode=false" >> $GITHUB_OUTPUT
            echo "mode_suffix=-mini" >> $GITHUB_OUTPUT
            echo "mode_label=OpenGL 小球版"
            echo "🔮 未检测到 Unity 模块 → 编译小球版"
          fi

  # ═══ 编译 Debug ═══
  build-debug:
    needs: detect-mode
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: 验证资源
        run: |
          echo "=== WebView assets ==="
          ls -la android_app/app/src/main/assets/linghui/ | head -10
          echo "=== Unity 模块 ==="
          ls unity_client/unityLibrary/build.gradle 2>/dev/null && echo "✅ 已检测" || echo "⛔ 未检测"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MODE="${{ needs.detect-mode.outputs.mode_suffix }}"
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}${MODE}" >> $GITHUB_OUTPUT
          echo "mode_label=${{ needs.detect-mode.outputs.mode_label }}" >> $GITHUB_OUTPUT

      - name: 编译 Debug APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleDebug --no-daemon

      - name: 确认产物
        run: |
          ls -lh android_app/app/build/outputs/apk/debug/app-debug.apk
          echo "APK 大小: $(du -h android_app/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ═══ 编译 Release ═══
  build-release:
    needs: [detect-mode, build-debug]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MODE="${{ needs.detect-mode.outputs.mode_suffix }}"
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}${MODE}" >> $GITHUB_OUTPUT
          echo "mode_label=${{ needs.detect-mode.outputs.mode_label }}" >> $GITHUB_OUTPUT

      - name: 编译 Release APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleRelease --no-daemon

      - name: 签名 Release APK
        run: |
          UNSIGNED=android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=${{ steps.version.outputs.apk_name }}-release.apk
          BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0

          if [ ! -f "$UNSIGNED" ]; then
            echo "❌ 未找到未签名 APK: $UNSIGNED"
            ls -R android_app/app/build/outputs/apk/release/
            exit 1
          fi

          $BUILD_TOOLS/apksigner sign \
            --ks linghui.jks \
            --ks-key-alias linghui \
            --ks-pass pass:linghui2025 \
            --key-pass pass:linghui2025 \
            --out "$SIGNED" \
            "$UNSIGNED"

          echo "✅ 已签名: $SIGNED ($(du -h $SIGNED | cut -f1))"

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-release
          path: ${{ steps.version.outputs.apk_name }}-release.apk
          retention-days: 90

      - name: 构建摘要
        run: |
          echo "╔═══════════════════════════════════╗"
          echo "║  灵绘 APK 构建完成               ║"
          echo "║  版本: ${{ steps.version.outputs.apk_name }}"
          echo "║  模式: ${{ needs.detect-mode.outputs.mode_label }}"
          echo "╚═══════════════════════════════════╝"
