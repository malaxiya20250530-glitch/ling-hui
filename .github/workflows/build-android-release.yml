name: 云编译 APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'android_app/**'
      - 'unity_client/**'
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'release'
        options: [debug, release]

jobs:
  # ═══ 检测构建模式 ═══
  detect-mode:
    runs-on: ubuntu-latest
    outputs:
      unity_mode: ${{ steps.detect.outputs.unity_mode }}
      mode_suffix: ${{ steps.detect.outputs.mode_suffix }}
      mode_label: ${{ steps.detect.outputs.mode_label }}
    steps:
      - uses: actions/checkout@v4

      - name: 检测 Unity 模块
        id: detect
        run: |
          if [ -f "unity_client/unityLibrary/build.gradle" ]; then
            echo "unity_mode=true" >> $GITHUB_OUTPUT
            echo "mode_suffix=-unity" >> $GITHUB_OUTPUT
            echo "mode_label=Unity 3D 角色版"
            echo "🎮 检测到 Unity 模块 → 编译 3D 角色版"
          else
            echo "unity_mode=false" >> $GITHUB_OUTPUT
            echo "mode_suffix=-mini" >> $GITHUB_OUTPUT
            echo "mode_label=OpenGL 小球版"
            echo "🔮 未检测到 Unity 模块 → 编译小球版"
          fi

  # ═══ 编译 Debug ═══
  build-debug:
    needs: detect-mode
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: 验证资源
        run: |
          echo "=== WebView assets ==="
          ls -la android_app/app/src/main/assets/linghui/ | head -10
          echo "=== Unity 模块 ==="
          ls unity_client/unityLibrary/build.gradle 2>/dev/null && echo "✅ 已检测" || echo "⛔ 未检测"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MODE="${{ needs.detect-mode.outputs.mode_suffix }}"
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}${MODE}" >> $GITHUB_OUTPUT
          echo "mode_label=${{ needs.detect-mode.outputs.mode_label }}" >> $GITHUB_OUTPUT

      - name: 编译 Debug APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleDebug --no-daemon

      - name: 确认产物
        run: |
          for LANG in zh en bn; do
            APK="android_app/app/build/outputs/apk/${LANG}/debug/app-${LANG}-debug.apk"
            if [ -f "$APK" ]; then
              echo "✅ ${LANG}: $APK ($(du -h $APK | cut -f1))"
            else
              echo "❌ ${LANG}: 未找到 $APK"
            fi
          done

      - name: 上传 Debug APK（三语）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-debug-all
          path: android_app/app/build/outputs/apk/*/debug/*.apk
          retention-days: 30

  # ═══ 编译 Release（三语版本）═══
  build-release:
    needs: [detect-mode, build-debug]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 版本号
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MODE="${{ needs.detect-mode.outputs.mode_suffix }}"
          echo "apk_name=LingHui-v${{ github.run_number }}-${SHORT_SHA}${MODE}" >> $GITHUB_OUTPUT

      - name: 编译三语 Release APK
        working-directory: android_app
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleZhRelease assembleEnRelease assembleBnRelease --no-daemon

      - name: 签名三语 APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1 | sed 's|/$||')
          BASE="${{ steps.version.outputs.apk_name }}"

          for LANG in zh en bn; do
            UNSIGNED="android_app/app/build/outputs/apk/${LANG}/release/app-${LANG}-release-unsigned.apk"
            SIGNED="${BASE}-${LANG}-release.apk"

            if [ ! -f "$UNSIGNED" ]; then
              echo "❌ 未找到: $UNSIGNED"
              ls android_app/app/build/outputs/apk/${LANG}/release/ 2>/dev/null || echo "(目录不存在)"
              continue
            fi

            $BUILD_TOOLS/apksigner sign \
              --ks linghui.jks \
              --ks-key-alias linghui \
              --ks-pass pass:linghui2025 \
              --key-pass pass:linghui2025 \
              --out "$SIGNED" \
              "$UNSIGNED"

            echo "✅ ${LANG} 已签名: $SIGNED ($(du -h $SIGNED | cut -f1))"
          done

      - name: 上传中文版
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-zh-release
          path: ${{ steps.version.outputs.apk_name }}-zh-release.apk
          retention-days: 90

      - name: 上传英文版
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-en-release
          path: ${{ steps.version.outputs.apk_name }}-en-release.apk
          retention-days: 90

      - name: 上传孟加拉语版
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}-bn-release
          path: ${{ steps.version.outputs.apk_name }}-bn-release.apk
          retention-days: 90

      - name: 构建摘要
        run: |
          echo "╔═══════════════════════════════════╗"
          echo "║  灵绘 APK 三语构建完成           ║"
          echo "║  中文版: ${{ steps.version.outputs.apk_name }}-zh-release.apk"
          echo "║  英文版: ${{ steps.version.outputs.apk_name }}-en-release.apk"
          echo "║  孟语版: ${{ steps.version.outputs.apk_name }}-bn-release.apk"
          echo "╚═══════════════════════════════════╝"
