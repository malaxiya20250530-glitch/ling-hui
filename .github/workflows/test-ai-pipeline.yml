name: 测试 AI 管线 + 自动化

on:
  push:
    paths:
      - 'ai_core/**'
      - 'automation/**'
      - 'personality/**'
      - 'config/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 验证导入
        run: |
          python3 -c "
          from personality.character import LingHuiCharacter
          from personality.memory import ConversationMemory
          from personality.emotions import EmotionState
          from ai_core.asr import SpeechRecognizer
          from ai_core.llm import ChatEngine
          from ai_core.tts import SpeechSynthesizer
          from ai_core.pipeline import LingHuiPipeline
          print('AI 管线导入成功 ✔')
          "

      - name: 自动化模块测试
        run: |
          python3 -c "
          from automation.droidwright import DroidWright, ExecutionStatus
          from automation.intent_parser import IntentParser
          from automation.actions import ActionResult

          # 意图解析测试
          r = IntentParser.parse('打开微信')
          assert r is not None and r.action_type == 'open_app'
          r = IntentParser.parse('亮度调到200')
          assert r is not None and r.action_type == 'brightness'
          r = IntentParser.parse('今天天气不错')
          assert r is None

          # DroidWright 无操作测试
          dw = DroidWright()
          outcome = dw.execute('你好')
          assert outcome['status'] == ExecutionStatus.NO_ACTION

          print('自动化模块测试通过 ✔')
          "

      - name: 烟雾测试
        run: |
          python3 -c "
          c = __import__('personality.character', fromlist=['LingHuiCharacter']).LingHuiCharacter()
          assert '灵绘' in c.build_system_prompt()
          print('烟雾测试通过 ✔')
          "
