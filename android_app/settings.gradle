pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "LingHui"
include ':app'

// ═══════════════════════════════════════════════════
// Unity 3D 模块 — 自动检测，无需手动开关
//
// 工作流:
//   1. 桌面 Unity Editor → Export Project → unity_client/
//   2. git add unity_client/ && git push
//   3. GitHub Actions 自动检测 → 编译 Unity 版 APK
//   4. 没有 unity_client 时 → 编译小球版 APK（默认）
//
// 检测逻辑: 检查 unityLibrary/build.gradle 是否存在
// ═══════════════════════════════════════════════════

def unityClientDir = new File(rootDir, '../unity_client')
def unityLibDir = new File(unityClientDir, 'unityLibrary')
def unityLibBuild = new File(unityLibDir, 'build.gradle')

if (unityClientDir.exists() && unityLibBuild.exists()) {
    include ':unityLibrary'
    project(':unityLibrary').projectDir = unityLibDir
    gradle.ext.unityEnabled = true
    logger.lifecycle("🎮 检测到 Unity 模块 → 编译 3D 角色版")
} else {
    gradle.ext.unityEnabled = false
    logger.lifecycle("🔮 未检测到 Unity 模块 → 编译 OpenGL 小球版")
}
