pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "LingHui"
include ':app'

// 如果 unityLibrary 存在则包含（Unity 导出后自动生效）
def unityLib = new File(rootDir, '../unity_client/unityLibrary')
if (unityLib.exists() && new File(unityLib, 'build.gradle').exists()) {
    include ':unityLibrary'
    project(':unityLibrary').projectDir = unityLib
}
