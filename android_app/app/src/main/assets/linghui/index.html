<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>灵绘 · 全功能</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0ddd5;font-family:"PingFang SC","Noto Sans SC",sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:linear-gradient(135deg,#1a0a0a,#2a1015);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ff440033;flex-shrink:0}
#topbar .logo{font-size:20px;font-weight:bold;background:linear-gradient(135deg,#ff4400,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#topbar .ws{font-size:11px;margin-left:auto;cursor:pointer;padding:4px 8px;border-radius:10px;border:1px solid transparent}
#topbar .ws.on{color:#4f4;border-color:#4f444}
#topbar .ws.off{color:#f44;border-color:#f4433}
#cfgOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:99;justify-content:center;align-items:center}
#cfgBox{background:#1a1418;border:1px solid #ff440066;border-radius:16px;padding:20px;min-width:260px;display:flex;flex-direction:column;gap:12px}
#cfgBox h3{color:#ff6600;font-size:14px}
#cfgBox input{width:100%;padding:10px;border-radius:10px;border:1px solid #ff440044;background:#0a0a0f;color:#e0ddd5;font-size:14px;outline:none}
#cfgBox button{padding:10px;border-radius:10px;border:none;background:#ff4400;color:#fff;font-size:14px;cursor:pointer}
#tabbar{display:flex;border-bottom:1px solid #ff440022;background:#110a0a;flex-shrink:0}
.tab{flex:1;padding:10px 0;text-align:center;color:#666;font-size:13px;cursor:pointer;border:none;background:none}
.tab.on{color:#ff4400;border-bottom:2px solid #ff4400}
#pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

/* 对话页 */
#chatPage{display:none;flex-direction:column;height:100%}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#ff4400,#cc3300);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#1a1418;border:1px solid #ff440033;border-bottom-left-radius:4px}
.msg .t{font-size:10px;opacity:.5;margin-top:4px}
#chatRow{display:flex;gap:8px;padding:8px 0;flex-shrink:0}
#chatRow input{flex:1;padding:12px;border-radius:20px;border:1px solid #ff440044;background:#1a1418;color:#e0ddd5;font-size:14px;outline:none}
#chatRow input:focus{border-color:#ff4400}
#chatRow button{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#ff4400,#cc3300);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}

/* 音乐页 */
#musicPage{display:none;flex-direction:column;gap:12px}
.card{background:#1a1418;border-radius:12px;padding:14px;border:1px solid #ff440022}
.card h3{color:#ff6600;font-size:14px;margin-bottom:8px}
#nowPlay{font-size:16px;font-weight:bold;color:#ff8800;min-height:22px}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:10px}
.ctl button{width:40px;height:40px;border-radius:50%;border:none;background:#ff440020;color:#ff6600;font-size:16px;cursor:pointer;transition:background .2s}
.ctl .big{width:56px;height:56px;background:#ff4400;color:#fff;font-size:22px}
#audioPlayer{display:none}
#playlist{list-style:none}
#playlist li{padding:10px;border-radius:8px;background:#1a1418;margin:4px 0;cursor:pointer;display:flex;justify-content:space-between;font-size:13px}
#playlist li.cur{border:1px solid #ff440066}
#lyricPanel{max-height:40vh;overflow-y:auto;padding:12px;margin:8px 0;border-radius:8px;background:#0a0a0f;scroll-behavior:smooth;display:none}
#lyricPanel.show{display:block}
#lyricPanel .lLine{padding:6px 12px;font-size:13px;color:#ffffff40;transition:color .3s,font-size .3s;cursor:pointer;border-radius:4px}
#lyricPanel .lLine.cur{color:#ff8800;font-size:16px;font-weight:bold;background:#ff880010}
#lyricPanel .lLine:hover{color:#ffffff80}
#lyricBtn{font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;background:#ffffff08}
#favBtn{font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;background:#ffffff08;margin-right:8px}
#favBtn.faved{color:#ffcc00}
#sleepRow{display:none;align-items:center;gap:8px;padding:8px;margin:8px 0;border-radius:8px;background:#1a1418}
#sleepRow.show{display:flex}
#sleepRow select{padding:6px 10px;border-radius:6px;border:1px solid #ffffff22;background:#0a0a0f;color:#e0ddd5;font-size:12px}
#sleepRow .sleepTime{color:#ff8800;font-size:18px;font-weight:bold;min-width:40px;text-align:center}
#sleepRow button{padding:6px 12px;border-radius:6px;border:none;font-size:12px;cursor:pointer}
#eqRow{display:flex;gap:6px;align-items:center;padding:8px;margin:8px 0;border-radius:8px;background:#1a1418;flex-wrap:wrap}
#eqRow span{color:#888;font-size:11px}
#eqRow select{padding:6px 10px;border-radius:6px;border:1px solid #ffffff22;background:#0a0a0f;color:#e0ddd5;font-size:12px}
#favTab{display:none;max-height:40vh;overflow-y:auto}
#favTab.show{display:block}
.addRow{display:flex;gap:8px;margin-top:8px}
.addRow button{flex:1;padding:10px;border-radius:8px;border:1px dashed #ff440044;background:transparent;color:#ff6600;font-size:12px;cursor:pointer}
#searchRow{display:flex;gap:8px;margin-bottom:8px}
#searchRow input{flex:1;padding:10px;border-radius:8px;border:1px solid #00bcd466;background:#0a0a0f;color:#e0ddd5;font-size:12px;outline:none}
#searchRow button{padding:10px 14px;border-radius:8px;border:none;background:#00bcd4;color:#fff;font-size:12px;cursor:pointer}
#searchResults{max-height:35vh;overflow-y:auto;margin-bottom:8px}
.sResult{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #ffffff08;cursor:pointer}
.sResult:active{background:#ffffff08}
.sResult .sThumb{width:40px;height:40px;border-radius:6px;background:#ffffff10;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sResult .sInfo{flex:1;min-width:0}
.sResult .sTitle{color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sResult .sArtist{color:#ffffff55;font-size:11px;margin-top:2px}
.sResult .sBtn{color:#00bcd4;font-size:20px;flex-shrink:0;padding:4px}
#dlRow{display:flex;gap:8px}
#dlRow input{flex:1;padding:10px;border-radius:8px;border:1px solid #ff440044;background:#0a0a0f;color:#e0ddd5;font-size:12px;outline:none}
#dlRow button{padding:10px 14px;border-radius:8px;border:none;background:#ff4400;color:#fff;font-size:12px;cursor:pointer}
#fileIn{display:none}

/* 语音页 */
#voicePage{display:none;flex-direction:column;align-items:center;gap:16px;padding-top:20px}
#micBtn{width:100px;height:100px;border-radius:50%;border:3px solid #ff4400;background:#1a0808;color:#ff4400;font-size:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;user-select:none}
#micBtn.on{background:#ff4400;color:#fff;box-shadow:0 0 30px #ff440066}
#vStatus{font-size:12px;color:#888;text-align:center}
#vText{text-align:center;font-size:16px;color:#ff8800;min-height:24px;max-width:280px}
#vReply{text-align:center;font-size:14px;color:#ccc;max-width:280px}
.wakeRow{display:flex;align-items:center;gap:8px;font-size:13px}
.sw{width:48px;height:26px;background:#333;border-radius:13px;cursor:pointer;position:relative}
.sw.on{background:#ff4400}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s}
.sw.on::after{transform:translateX(22px)}
</style>
</head>
<body>

<!-- 服务器配置浮层 -->
<div id="cfgOverlay" onclick="if(event.target===this)closeCfg()">
  <div id="cfgBox">
    <h3>⚙ 服务器配置</h3>
    <input id="cfgHost" placeholder="主机地址，如 192.168.1.x" autocomplete="off">
    <input id="cfgPort" placeholder="WebSocket 端口，默认 9527" autocomplete="off">
    <button onclick="applyCfg()">连接</button>
  </div>
</div>

<div id="topbar">
  <span class="logo">🔥 灵绘</span>
  <span class="ws off" id="wsDot" onclick="openCfg()">● 离线</span>
</div>

<div id="tabbar">
  <button class="tab on" data-p="chatPage">💬 对话</button>
  <button class="tab" data-p="musicPage">🎵 音乐</button>
  <button class="tab" data-p="voicePage">🎤 语音</button>
</div>

<div id="pages">
  <!-- 对话 -->
  <div id="chatPage">
    <div id="msgs">
      <div class="msg ai">你好！我是灵绘🤖 我是 AI助手，不是哪吒～<br>连上后端才能发挥全部能力哦。</div>
    </div>
    <div id="chatRow">
      <input id="chatIn" placeholder="输入消息..." autocomplete="off">
      <button onclick="sendMsg()" title="发送">➤</button>
    </div>
  </div>

  <!-- 音乐 -->
  <div id="musicPage">
    <div class="card">
      <h3>正在播放</h3>
      <div id="nowPlay">未选择</div>
      <div class="ctl">
        <button onclick="prev()">⏮</button>
        <button class="big" id="playBtn" onclick="toggle()">▶</button>
        <button onclick="next()">⏭</button>
      </div>
    </div>
    <audio id="audioPlayer" preload="auto"></audio>
    <div class="addRow">
      <button onclick="document.getElementById('fileIn').click()">📁 上传音乐</button>
      <button onclick="scanMusic()">🔄 扫描内置</button>
    </div>
    <div id="searchRow">
      <input id="searchIn" placeholder="🔍 全网搜歌..." autocomplete="off">
      <button onclick="searchMusic()">搜索</button>
    </div>
    <div id="searchResults"></div>
    <div id="dlRow">
      <input id="dlUrl" placeholder="粘贴歌曲下载链接..." autocomplete="off">
      <button onclick="dlSong()">下载</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
    <span style="color:#888;font-size:12px">📜 歌词</span>
    <span id="favBtn" onclick="toggleFav()" title="单击收藏/取消 | 长按查看收藏">☆</span><span id="lyricBtn" onclick="toggleLyric()">📜</span>
  </div>
  <div id="lyricPanel"></div>
  <div id="favTab"></div>
  <div id="sleepRow">
    <span>⏰</span>
    <select id="sleepOpt" onchange="setSleep()">
      <option value="0">关闭</option><option value="15">15分钟</option><option value="30">30分钟</option>
      <option value="45">45分钟</option><option value="60">60分钟</option>
    </select>
    <span class="sleepTime" id="sleepTime"></span>
    <button onclick="cancelSleep()" style="background:#f44;color:#fff">取消</button>
  </div>
  <div id="eqRow">
    <span>🎚</span>
    <select id="eqPreset" onchange="setEqPreset()">
      <option value="0">关闭</option><option value="1">重低音</option><option value="2">流行</option>
      <option value="3">古典</option><option value="4">摇滚</option><option value="5">爵士</option>
      <option value="6">人声</option>
    </select>
  </div>
  <ul id="playlist"></ul>
    <input type="file" id="fileIn" accept="audio/*" multiple>
  </div>

  <!-- 语音 -->
  <div id="voicePage">
    <div class="wakeRow">
      <span>语音唤醒</span>
      <div class="sw" id="wakeSw" onclick="toggleWake()"></div>
      <span id="wakeLbl" style="color:#888;font-size:12px">关闭</span>
    </div>
    <div id="micBtn" onclick="toggleMic()">🎤</div>
    <div id="vStatus">点击麦克风开始</div>
    <div id="vText"></div>
    <div id="vReply"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  WebSocket 连接管理
// ═══════════════════════════════════════
let WS_URL='',ws=null,wsReady=false;
const pending=[];

function wsUrl(){return WS_URL||'ws://'+location.hostname+':9527/ws';}

function connectWS(){
  const url=wsUrl();
  try{
    ws=new WebSocket(url);
    ws.onopen=function(){
      wsReady=true;
      var d=document.getElementById('wsDot');
      d.textContent='● 在线';
      d.className='ws on';
      pending.forEach(function(m){ws.send(JSON.stringify(m))});
      pending.length=0;
      sendWS({type:'music_list'});
    };
    ws.onmessage=function(e){
      var msg;
      try{msg=JSON.parse(e.data);}catch(_){return;}
      handleWS(msg);
    };
    ws.onclose=function(){
      wsReady=false;
      var d=document.getElementById('wsDot');
      d.textContent='● 离线';
      d.className='ws off';
      setTimeout(connectWS,3000);
    };
    ws.onerror=function(){if(ws)ws.close();};
  }catch(_){setTimeout(connectWS,3000);}
}

function sendWS(msg){
  if(wsReady&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(msg));
  else pending.push(msg);
}

function handleWS(msg){
  switch(msg.type){
    case 'pet_response':
      addMsg('ai',msg.text);
      if(document.getElementById('wakeSw').classList.contains('on')) speakText(msg.text);
      break;
    case 'music_list':
      var files=msg.files||[];
      playlist=files.map(function(f){return {name:f.name||f,path:f.url||f,builtin:true}});
      renderList();
      break;
    case 'music_downloaded':
      addMsg('ai','已下载: '+msg.name+' ('+(msg.size/1024).toFixed(0)+'KB)');
      sendWS({type:'music_list'});
      break;
    case 'error':
      addMsg('ai','⚠ '+msg.message);
      break;
  }
}

// ═══════════════════════════════════════
//  服务器配置
// ═══════════════════════════════════════
function openCfg(){
  document.getElementById('cfgOverlay').style.display='flex';
  var h=document.getElementById('cfgHost');
  var p=document.getElementById('cfgPort');
  h.value=localStorage.getItem('lh_host')||location.hostname;
  p.value=localStorage.getItem('lh_port')||'9527';
  h.focus();
}

function closeCfg(){
  document.getElementById('cfgOverlay').style.display='none';
}

function applyCfg(){
  var h=document.getElementById('cfgHost').value.trim();
  var p=document.getElementById('cfgPort').value.trim()||'9527';
  if(!h)return;
  localStorage.setItem('lh_host',h);
  localStorage.setItem('lh_port',p);
  WS_URL='ws://'+h+':'+p+'/ws';
  closeCfg();
  if(ws){ws.close();ws=null;}
  wsReady=false;
  pending.length=0;
  var d=document.getElementById('wsDot');
  d.textContent='● 连接中...';
  d.className='ws off';
  connectWS();
}

// ═══════════════════════════════════════
//  标签切换
// ═══════════════════════════════════════
document.querySelectorAll('#tabbar .tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('#tabbar .tab').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    var pid=btn.dataset.p;
    document.querySelectorAll('#pages>div').forEach(function(d){d.style.display='none'});
    var page=document.getElementById(pid);
    page.style.display=(pid==='chatPage'?'flex':'block');
    if(pid==='musicPage'&&wsReady) sendWS({type:'music_list'});
    if(pid==='voicePage') initVoice();
  });
});
document.getElementById('chatPage').style.display='flex';

// ═══════════════════════════════════════
//  文本对话
// ═══════════════════════════════════════
function sendMsg(){
  var inp=document.getElementById('chatIn');
  var txt=inp.value.trim();
  if(!txt)return;
  addMsg('me',txt);
  inp.value='';
  inp.focus();
  if(wsReady){sendWS({type:'user_input',text:txt});}
  else{addMsg('ai','🔌 未连接后端 — 点击右上角 ●离线 配置服务器地址');}
}

document.getElementById('chatIn').addEventListener('keydown',function(e){
  if(e.key==='Enter')sendMsg();
});

function addMsg(role,text){
  var d=document.createElement('div');
  d.className='msg '+role;
  var now=new Date();
  d.innerHTML=text+'<div class=t>'+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+'</div>';
  var m=document.getElementById('msgs');
  m.appendChild(d);
  m.scrollTop=m.scrollHeight;
}

// ═══════════════════════════════════════
//  语音合成（TTS）
// ═══════════════════════════════════════
function speakText(text){
  if(!window.speechSynthesis)return;
  var u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';
  u.rate=1.0;
  u.pitch=1.1;
  u.volume=0.8;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════
//  音乐播放
// ═══════════════════════════════════════
let playlist=[],curIdx=-1;
const audio=document.getElementById('audioPlayer');

audio.addEventListener('ended',function(){
  if(curIdx<playlist.length-1){curIdx++;play(curIdx);}
});

audio.addEventListener('error',function(){
  document.getElementById('nowPlay').textContent='⚠ 无法播放: '+(playlist[curIdx]?playlist[curIdx].name:'');
});

function scanMusic(){
  // 内置曲库检测（零后端可用）
  detectBuiltinSongs();
  if(wsReady){sendWS({type:'music_list'});return;}
  // 离线模式：尝试从本地存储恢复播放列表
  var saved=localStorage.getItem('lh_playlist');
  if(saved){
    try{playlist=JSON.parse(saved);renderList();return;}catch(e){}
  }
  if(playlist.length===0){
    document.getElementById('nowPlay').textContent='📁 无音乐 — 上传文件或搜索歌曲';
  }else{
    renderList();
  }
}

// 检测 APK 内置音乐文件
function detectBuiltinSongs(){
  var builtin=['SoundHelix-Song-8']; // APK 内置曲库列表
  builtin.forEach(function(name,i){
    var path='file:///android_asset/linghui/music/'+name+'.mp3';
    // 避免重复
    if(!playlist.find(function(s){return s.path===path})){
      playlist.push({name:name,path:path,builtin:true});
    }
  });
  renderList();
}

function renderList(){
  var ul=document.getElementById('playlist');
  ul.innerHTML='';
  playlist.forEach(function(s,i){
    var li=document.createElement('li');
    if(i===curIdx)li.classList.add('cur');
    li.innerHTML='<span onclick="play('+i+')" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.name+'</span><span onclick="delSong('+i+',event)" style="color:#f44;cursor:pointer;padding:0 8px;font-size:16px">×</span>';
    ul.appendChild(li);
  });
  // 持久化播放列表
  try{localStorage.setItem('lh_playlist',JSON.stringify(playlist));}catch(e){}
}

function play(idx){
  if(idx<0||idx>=playlist.length)return;
  curIdx=idx;
  var s=playlist[idx];
  // 内置音乐走原生 MediaPlayer（更可靠）
  if(s.builtin&&s.path.indexOf('android_asset')>=0){
    var name=s.name.replace('.mp3','').replace(/\.mp3$/,'');
    if(window.LingHuiBridge&&typeof LingHuiBridge.playBuiltinMusic==='function'){
      LingHuiBridge.playBuiltinMusic(name);
    }
    document.getElementById('nowPlay').textContent=s.name;
    document.getElementById('playBtn').textContent='⏸';
    renderList();
    return;
  }
  audio.src=s.path;
  audio.play().catch(function(){});
  document.getElementById('nowPlay').textContent=s.name;
  document.getElementById('playBtn').textContent='⏸';
  renderList();
}

// 停止音乐（WebView 侧）
function stopMusic(){
  audio.pause();
  audio.src='';
  document.getElementById('playBtn').textContent='▶';
  if(window.LingHuiBridge&&typeof LingHuiBridge.stopMusic==='function'){
    LingHuiBridge.stopMusic();
  }
}

function toggle(){
  if(audio.paused&&!audio.src){
    if(curIdx<0&&playlist.length>0)play(0);
    else audio.play().catch(function(){});
    document.getElementById('playBtn').textContent='⏸';
    return;
  }
  if(audio.paused||audio.ended){
    if(curIdx<0&&playlist.length>0)play(0);
    else audio.play().catch(function(){});
    document.getElementById('playBtn').textContent='⏸';
  }else{
    stopMusic();
  }
}

function prev(){
  if(playlist.length===0)return;
  var idx=(curIdx-1+playlist.length)%playlist.length;
  play(idx);
}

function next(){
  if(playlist.length===0)return;
  var idx=(curIdx+1)%playlist.length;
  play(idx);
}

function delSong(idx,ev){
  ev.stopPropagation();
  if(curIdx===idx){audio.pause();audio.src='';curIdx=-1;document.getElementById('nowPlay').textContent='未选择';document.getElementById('playBtn').textContent='▶';}
  else if(curIdx>idx)curIdx--;
  playlist.splice(idx,1);
  renderList();
}

// 全网搜歌 — 后端优先，不可用时用 iTunes 公开 API
async function searchMusic(){
  var q=document.getElementById('searchIn').value.trim();
  if(!q)return;
  var div=document.getElementById('searchResults');
  div.innerHTML='<div style="color:#888;padding:10px;text-align:center">🔍 搜索中...</div>';

  // 先尝试后端
  if(wsReady){
    try{
      var r=await fetch('http://localhost:8801/music/search?q='+encodeURIComponent(q));
      var data=await r.json();
      if(data.songs&&data.songs.length>0){
        renderSearchResults(data.songs,div);
        return;
      }
    }catch(e){/* 后端不可用，降级到 iTunes */}
  }

  // 降级: iTunes Search API（公开免费，零后端）
  try{
    var r2=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&limit=10');
    var d2=await r2.json();
    if(!d2.results||d2.results.length===0){
      div.innerHTML='<div style="color:#888;padding:10px;text-align:center">未找到结果</div>';
      return;
    }
    var songs=d2.results.map(function(s){
      return {
        id:s.trackId,
        title:s.trackName,
        url:s.previewUrl||s.trackViewUrl,
        uploader:s.artistName,
        duration:s.trackTimeMillis?(Math.floor(s.trackTimeMillis/60000)+':'+Math.floor((s.trackTimeMillis%60000)/1000).toString().padStart(2,'0')):'',
        artwork:s.artworkUrl100||'',
        preview:!!s.previewUrl
      };
    });
    renderSearchResults(songs,div);
  }catch(e){
    div.innerHTML='<div style="color:#f44;padding:10px;text-align:center">搜索失败: '+e.message+'</div>';
  }
}

function renderSearchResults(songs,div){
  var html='';
  songs.forEach(function(s,i){
    if(s.error)return;
    var iconHtml=s.artwork?'<img src="'+s.artwork+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover">':'<div class=sThumb>🎵</div>';
    var btnHtml=s.url&&s.url.startsWith('https://')&&s.preview!==false
      ?'<div class=sBtn onclick="event.stopPropagation();previewSong(\''+s.url.replace(/'/g,"\\'")+'\',\''+(s.title||'').replace(/'/g,"\\'")+'\')">▶</div>'
      :'<div class=sBtn style="color:#888">🔗</div>';
    html+='<div class=sResult>'
      +iconHtml
      +'<div class=sInfo onclick="dlFromSearch(\''+(s.url||'').replace(/'/g,"\\'")+'\',\''+(s.title||'').replace(/'/g,"\\'")+'\')"><div class=sTitle>'+s.title+'</div><div class=sArtist>'+s.uploader+' · '+s.duration+'</div></div>'
      +btnHtml+'</div>';
  });
  div.innerHTML=html;
}

// iTunes 试听 — 直接用预览 URL 播放
function previewSong(url,title){
  if(!url)return;
  var a=document.getElementById('audioPlayer');
  a.src=url;
  a.play().catch(function(){});
  document.getElementById('nowPlay').textContent='🔊 试听: '+title;
  document.getElementById('playBtn').textContent='⏸';
  // 添加到临时播放列表
  var found=playlist.findIndex(function(s){return s.path===url});
  if(found<0){
    playlist.unshift({name:title||'试听',path:url,builtin:true});
    curIdx=0;
    renderList();
  }else{
    curIdx=found;
    renderList();
  }
}

// 从搜索结果自动下载
async function dlFromSearch(url,title){
  var div=document.getElementById('searchResults');
  div.innerHTML='<div style="color:#0f0;padding:10px;text-align:center">⏳ 下载中: '+title+'...</div>';
  try{
    var r=await fetch('http://localhost:8801/music/download',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:url})
    });
    var data=await r.json();
    if(data.task_id){
      pollDownload(data.task_id,title);
    }
  }catch(e){
    div.innerHTML='<div style="color:#f44;padding:10px;text-align:center">下载失败: '+e.message+'</div>';
  }
}

// 轮询下载进度
function pollDownload(taskId,title){
  var div=document.getElementById('searchResults');
  var check=setInterval(async function(){
    try{
      var r=await fetch('http://localhost:8801/music/status/'+taskId);
      var s=await r.json();
      if(s.status==='ok'){
        clearInterval(check);
        div.innerHTML='<div style="color:#0f0;padding:10px;text-align:center">✅ 已下载: '+title+'</div>';
        refreshPlaylist();
      }else if(s.status==='error'){
        clearInterval(check);
        div.innerHTML='<div style="color:#f44;padding:10px;text-align:center">下载失败: '+(s.error||'')+'</div>';
      }else{
        div.innerHTML='<div style="color:#ff0;padding:10px;text-align:center">⏳ 下载中... '+title+'</div>';
      }
    }catch(e){clearInterval(check);}
  },2000);
}

// 刷新播放列表（从桥接获取已下载歌曲）
async function refreshPlaylist(){
  try{
    var r=await fetch('http://localhost:8801/music/list');
    var data=await r.json();
    if(data.songs){
      playlist=data.songs.map(function(s){
        return {name:s.title,path:'http://localhost:8801/music/file/'+s.file,builtin:false};
      });
      renderList();
    }
  }catch(e){}
}

async function dlSong(){
  var url=document.getElementById('dlUrl').value.trim();
  if(!url)return;
  var st=document.getElementById('nowPlay');
  st.textContent='⏳ 下载中...';
  try{
    if(wsReady){
      sendWS({type:'music_download',url:url});
      st.textContent='⏳ 已发送下载请求...';
    }else{
      var r=await fetch(url);
      if(!r.ok)throw new Error('HTTP '+r.status);
      var blob=await r.blob();
      var name=url.split('/').pop().split('?')[0]||'download.mp3';
      var objUrl=URL.createObjectURL(blob);
      playlist.push({name:name,path:objUrl,builtin:false});
      renderList();
      st.textContent='已下载: '+name+' ('+(blob.size/1024).toFixed(0)+'KB)';
    }
    document.getElementById('dlUrl').value='';
  }catch(e){
    st.textContent='下载失败: '+e.message;
  }
}

// 音乐上传（通过后端 /music/upload）
document.getElementById('fileIn').addEventListener('change',function(){
  if(wsReady){
    var st=document.getElementById('nowPlay');
    var files=this.files;
    (async function(){
      for(var i=0;i<files.length;i++){
        var f=files[i];
        st.textContent='⏳ 上传中: '+f.name;
        try{
          var host=localStorage.getItem('lh_host')||location.hostname;
          var resp=await fetch('http://'+host+':8080/music/upload',{
            method:'POST',
            headers:{'X-Filename':encodeURIComponent(f.name)},
            body:f
          });
          if(resp.ok){
            st.textContent='已上传: '+f.name;
            sendWS({type:'music_list'});
          }else{
            st.textContent='上传失败: HTTP '+resp.status;
          }
        }catch(e){
          st.textContent='上传失败: '+e.message;
        }
        await new Promise(function(r){setTimeout(r,500)});
      }
    })();
  }else{
    for(var i=0;i<this.files.length;i++){
      var f=this.files[i];
      var url=URL.createObjectURL(f);
      playlist.push({name:f.name,path:url,builtin:false});
    }
    renderList();
  }
  this.value='';
});

// ═══════════════════════════════════════
//  语音识别
// ═══════════════════════════════════════
let rec=null,wakeOn=false,listening=false;

function initVoice(){
  if(rec)return;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('vStatus').textContent='浏览器不支持语音识别';return;}
  rec=new SR();
  rec.lang='zh-CN';
  rec.interimResults=true;
  rec.continuous=false;
  rec.maxAlternatives=3;

  rec.onresult=function(e){
    var txts=[];
    for(var i=e.resultIndex;i<e.results.length;i++)
      for(var j=0;j<e.results[i].length;j++)
        txts.push(e.results[i][j].transcript.trim());
    var best=txts[0]||'';
    document.getElementById('vText').textContent=best;

    if(e.results[e.results.length-1].isFinal){
      if(wakeOn){
        var W=['你好灵绘','灵绘','嘿灵绘','小灵','灵灵'];
        var hit=false;
        for(var ti=0;ti<txts.length;ti++)
          for(var wi=0;wi<W.length;wi++)
            if(txts[ti]===W[wi]||txts[ti].startsWith(W[wi])){hit=true;break;}
        if(!hit){if(listening)setTimeout(startRec,300);return;}
        document.getElementById('vText').textContent='🔔 唤醒: '+best;
      }
      addMsg('me','🎤 '+best);
      if(wsReady){
        sendWS({type:'voice_chat',text:best});
        document.getElementById('vReply').textContent='⏳ 思考中...';
      }else{
        document.getElementById('vReply').textContent='🔌 未连接后端 — 点击右上角 ●离线 配置服务器';
      }
      if(listening)setTimeout(startRec,2000);
    }
  };

  rec.onerror=function(e){
    if(e.error!=='aborted'&&e.error!=='no-speech') document.getElementById('vStatus').textContent='错误: '+e.error;
    if(listening&&e.error!=='aborted')setTimeout(startRec,800);
  };

  rec.onend=function(){
    if(listening&&!wakeOn){
      document.getElementById('micBtn').classList.remove('on');
      document.getElementById('vStatus').textContent='点击麦克风开始';
    }
  };
}

function startRec(){
  if(!rec)return;
  try{rec.start();
    document.getElementById('micBtn').classList.add('on');
    document.getElementById('vStatus').textContent=wakeOn?'👂 监听唤醒词: 你好灵绘 / 灵绘...':'🎙 正在听...';}
  catch(e){}
}

function stopRec(){
  try{rec.stop();}catch(e){}
  document.getElementById('micBtn').classList.remove('on');
}

function toggleMic(){
  if(!rec)initVoice();
  if(!rec)return;
  if(listening){listening=false;stopRec();document.getElementById('vStatus').textContent='点击麦克风开始';}
  else{listening=true;startRec();}
}

function toggleWake(){
  wakeOn=!wakeOn;
  var sw=document.getElementById('wakeSw');
  var lb=document.getElementById('wakeLbl');
  if(wakeOn){sw.classList.add('on');lb.textContent='开启';if(!listening){listening=true;startRec();}}
  else{sw.classList.remove('on');lb.textContent='关闭';}
}


// 歌词显示
function toggleLyric(){
  var p=document.getElementById('lyricPanel');
  p.classList.toggle('show');
  if(p.classList.contains('show')&&curIdx>=0){
    loadLyrics(playlist[curIdx]);
  }
}

async function loadLyrics(song){
  var p=document.getElementById('lyricPanel');
  p.innerHTML='<div style="text-align:center;color:#888;padding:20px">⏳ 加载歌词...</div>';
  try{
    var r=await fetch('http://localhost:8801/music/lyrics/'+encodeURIComponent(song.name||''));
    var data=await r.json();
    if(data.format==='none'||!data.lines||data.lines.length===0){
      p.innerHTML='<div style="text-align:center;color:#888;padding:20px">暂无歌词 😔</div>';
      return;
    }
    p.innerHTML=data.lines.map(function(l){
      return '<div class="lLine" data-t="'+l.time+'">'+l.text+'</div>';
    }).join('');
    // 播放时同步高亮当前行
    if(audio&&!audio.paused){
      highlightLyricLine();
    }
  }catch(e){
    p.innerHTML='<div style="text-align:center;color:#f44;padding:20px">加载失败: '+e.message+'</div>';
  }
}

function highlightLyricLine(){
  if(!audio||audio.paused)return;
  var lines=document.querySelectorAll('#lyricPanel .lLine');
  var cur=audio.currentTime;
  var active=-1;
  lines.forEach(function(l,i){
    var t=parseFloat(l.dataset.t)||0;
    if(t<=cur)active=i;
    l.classList.remove('cur');
  });
  if(active>=0){
    lines[active].classList.add('cur');
    lines[active].scrollIntoView({behavior:'smooth',block:'center'});
  }
  setTimeout(highlightLyricLine,500);
}
audio.addEventListener('timeupdate',function(){
  var p=document.getElementById('lyricPanel');
  if(p.classList.contains('show'))highlightLyricLine();
});

// 收藏管理
let favSongs=JSON.parse(localStorage.getItem('lh_favs')||'[]');
function toggleFav(){
  if(curIdx<0||curIdx>=playlist.length)return;
  var s=playlist[curIdx];
  var btn=document.getElementById('favBtn');
  var idx=favSongs.findIndex(function(f){return f.name===s.name});
  if(idx>=0){
    favSongs.splice(idx,1);
    btn.classList.remove('faved');
    btn.textContent='☆';
  }else{
    favSongs.push({name:s.name,path:s.path});
    btn.classList.add('faved');
    btn.textContent='★';
  }
  localStorage.setItem('lh_favs',JSON.stringify(favSongs));
}

function showFavs(){
  var tab=document.getElementById('favTab');
  if(tab.classList.contains('show')){tab.classList.remove('show');return;}
  tab.classList.add('show');
  renderFavs();
}

function renderFavs(){
  var tab=document.getElementById('favTab');
  if(favSongs.length===0){
    tab.innerHTML='<div style="text-align:center;color:#888;padding:20px">暂无收藏</div>';
    return;
  }
  tab.innerHTML=favSongs.map(function(s,i){
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#1a1418;margin:4px 0;cursor:pointer" onclick="playFav('+i+')">'
      +'<span>⭐</span><span style="flex:1;font-size:13px">'+s.name+'</span>'
      +'<span onclick="delFav('+i+',event)" style="color:#f44;padding:4px 8px">×</span></div>';
  }).join('');
}

function playFav(idx){
  if(idx<0||idx>=favSongs.length)return;
  // 在 playlist 中查找
  var found=playlist.findIndex(function(s){return s.name===favSongs[idx].name});
  if(found>=0)play(found);
  else{
    playlist.push(favSongs[idx]);
    play(playlist.length-1);
  }
}

function delFav(idx,ev){
  ev.stopPropagation();
  favSongs.splice(idx,1);
  localStorage.setItem('lh_favs',JSON.stringify(favSongs));
  renderFavs();
}

// 睡眠定时器
let sleepTimer=null;
function setSleep(){
  var opt=document.getElementById('sleepOpt');
  var min=parseInt(opt.value)||0;
  var row=document.getElementById('sleepRow');
  var timeEl=document.getElementById('sleepTime');
  if(sleepTimer){clearInterval(sleepTimer);sleepTimer=null;}
  if(min===0){
    row.classList.remove('show');
    timeEl.textContent='';
    return;
  }
  row.classList.add('show');
  var target=Date.now()+min*60000;
  function updateCountdown(){
    var remain=Math.max(0,Math.ceil((target-Date.now())/1000));
    var m=Math.floor(remain/60);
    var s=remain%60;
    timeEl.textContent=m+':'+s.toString().padStart(2,'0');
    if(remain<=0){
      clearInterval(sleepTimer);
      sleepTimer=null;
      if(audio&&!audio.paused){audio.pause();document.getElementById('playBtn').textContent='▶';}
      timeEl.textContent='已暂停';
      opt.value='0';
    }
  }
  updateCountdown();
  sleepTimer=setInterval(updateCountdown,1000);
}

function cancelSleep(){
  if(sleepTimer){clearInterval(sleepTimer);sleepTimer=null;}
  document.getElementById('sleepRow').classList.remove('show');
  document.getElementById('sleepTime').textContent='';
  document.getElementById('sleepOpt').value='0';
}

  }
}
